[upload]
shows_root = "/path/to/shows"
log = true
# Maximum simultaneous file transfers per show, including in batch mode.
upload_workers = 3
# Preparation defaults to one worker per logical CPU, capped by track count.
# Uncomment to limit simultaneous conversion/tagging jobs on this machine.
# prepare_workers = 16
# FLAC level 0-8; default 5. Use "uncompressed" for verbatim encoding.
# flac_compression = 5

[upload.resume]
enabled = true
part_size_mib = 16

[upload.recovery]
retries = 3
checks = 3
delay = 30.0
max_delay = 300.0

[report]
query = ['collection:(etree OR taperssection)']
sort = "publicdate"
reverse = false
timeout = 30.0
view_batch_size = 100
exclude_zero_views = true

# Keep per-prefix preferences after all basic upload/report settings.
# Replace this generic prefix and values with your approved preferences.
[upload.prefix.band]
collection = "ArchiveCollection"
creator = "Example Artist"
genre = "Rock"
