[uploader]
shows_root = "/path/to/shows"
log = true
upload_workers = 3

[uploader.recovery]
retries = 3
checks = 3
delay = 30.0
max_delay = 300.0

[uploader.collections]
# identifier_prefix = "ArchiveCollection"
# gd = "GratefulDead"

[views]
query = ['collection:(etree OR taperssection)']
sort = "publicdate"
reverse = false
timeout = 30.0
view_batch_size = 100
exclude_zero_views = true
