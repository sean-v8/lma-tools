# Copy to config.toml, or migrate existing settings as described in README.
[uploader]
shows_root = "/path/to/shows"
log = true
[uploader.recovery]
retries = 3
checks = 3
delay = 30.0
max_delay = 300.0

[uploader.collections]
# band = "ArchiveCollection"

[views]
query = ['collection:(etree OR taperssection)']
sort = "publicdate"
reverse = false
timeout = 30.0
view_batch_size = 100
exclude_zero_views = true
